# ==============================================================
#  ANTCON YÖNETİM PANELİ (Decap CMS) AYARLARI
# --------------------------------------------------------------
#  Panel adresi: https://antconvention.com/admin/
#  Kullanım kılavuzu: CMS_KULLANIM.md
#
#  Buradaki her alan src/content.config.ts içindeki bir şema
#  alanına karşılık gelir. Bir alan eklerken/silerken iki dosyayı
#  birlikte güncelleyin; aksi halde derleme hata verir (Netlify bu
#  durumda sitenin önceki halini yayında tutar).
# ==============================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Panel: {{collection}} / "{{slug}}" eklendi'
    update: 'Panel: {{collection}} / "{{slug}}" güncellendi'
    delete: 'Panel: {{collection}} / "{{slug}}" silindi'
    uploadMedia: 'Panel: "{{path}}" yüklendi'
    deleteMedia: 'Panel: "{{path}}" silindi'

# Yerel geliştirme: `npx decap-server` çalışıyorsa panel (yalnızca
# localhost'ta) GitHub yerine doğrudan bu bilgisayardaki dosyalara yazar.
local_backend: true

locale: tr
site_url: https://antconvention.com
display_url: https://antconvention.com
logo_url: /apple-touch-icon.png

# Panelden yüklenen görseller. src/ altında olmaları bilinçli: Astro bu
# klasördeki görselleri derlemede WebP'ye çevirip boyutlandırır. public/
# altına konan bir görsel ise ziyaretçiye olduğu gibi (MB'larca) gider.
media_folder: src/assets/yuklemeler
public_folder: /src/assets/yuklemeler

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ------------------------------------------------------------
  #  HIZLI AYARLAR
  # ------------------------------------------------------------
  - name: ayarlar
    label: "⚙️ Genel Ayarlar"
    label_singular: "Ayar"
    description: "Bilet satışını açıp kapatma, site adı, logo, iletişim bilgileri, sosyal medya ve menüler."
    editor: { preview: false }
    files:
      - name: bilet-satisi
        label: "🎟️ Bilet Satışı (Aç / Kapat)"
        file: src/content/ayarlar/bilet-satisi.json
        fields:
          - label: "Bilet Satışı Açık mı?"
            name: satisAcik
            widget: boolean
            required: false
            hint: "Açtığınızda sitedeki tüm 'Haberdar Ol' butonları 'Bilet Al' olur ve Biletler sayfası satış bölümünü gösterir. Kapattığınızda satış bölümü gizlenir, yerine bilgilendirme metni çıkar."
          - label: "Bilet Satış Linki"
            name: satisUrl
            widget: string
            required: false
            hint: "Biletleri Biletix, Bubilet, Passo gibi bir sitede satıyorsanız tam adresi yapıştırın (https:// ile başlamalı). Boş bırakırsanız butonlar sitedeki Biletler sayfasına gider."
          - { label: "Buton Metni (satış açıkken)", name: acikButonMetni, widget: string, default: "Bilet Al" }
          - { label: "Buton Metni (satış kapalıyken)", name: kapaliButonMetni, widget: string, default: "Haberdar Ol" }
          - label: "Bilgi Metni (satış açıkken)"
            name: acikMetni
            widget: text
            hint: "Ana sayfanın altında ve Biletler sayfasında görünür."
          - label: "Bilgi Metni (satış kapalıyken)"
            name: kapaliMetni
            widget: text
            hint: "Satış kapalıyken ziyaretçiye ne söylemek istersiniz? Örn. 'Bilet satışı yakında başlıyor'."
          - label: "Fiyat Notu"
            name: fiyatNotu
            widget: text
            required: false
            hint: "Bilet kartlarının altında küçük yazıyla görünür (KDV, çocuk indirimi vb.)."
          - label: "Hakkında Sayfasındaki Durum (satış açıkken)"
            name: acikDurum
            widget: object
            collapsed: true
            fields:
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: string }
          - label: "Hakkında Sayfasındaki Durum (satış kapalıyken)"
            name: kapaliDurum
            widget: object
            collapsed: true
            fields:
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: string }

      - name: site
        label: "🌐 Site Ayarları (ad, logo, iletişim, menü)"
        file: src/content/ayarlar/site.json
        fields:
          - { label: "Site Adı", name: ad, widget: string, hint: "Menüde, sekme başlığında ve logonun yanında görünür." }
          - { label: "Sitenin Tam Adı", name: tamAd, widget: string, hint: "Google ve sosyal medya paylaşımlarında görünür." }
          - { label: "Slogan", name: slogan, widget: string }
          - label: "Site Açıklaması"
            name: aciklama
            widget: text
            hint: "Google'da sitenin altında görünen kısa tanıtım. {aktifYil} yazarsanız sıradaki etkinlik yılı otomatik yazılır."
          - label: "Logo"
            name: logo
            widget: image
            choose_url: false
            media_folder: /images
            public_folder: /images
            hint: "Kare, şeffaf arka planlı PNG yükleyin. Menüdeki beyaz logo, tarayıcı sekmesindeki ikon (favicon) ve sosyal medya paylaşım görseli bundan otomatik üretilir."
          - label: "Sıradaki Etkinlik Yılı"
            name: aktifYil
            widget: number
            value_type: int
            min: 2026
            max: 2100
            hint: "Sitenin öne çıkardığı etkinlik. DİKKAT: Değiştirmeden önce 'Etkinlik Yılları' bölümünde o yılın kaydını oluşturun, yoksa site güncellenmez."
          - label: "Son Gerçekleşen Etkinlik Yılı"
            name: sonEtkinlikYili
            widget: number
            value_type: int
            min: 2026
            max: 2100
            hint: "Ana sayfadaki 'geçen yıl' özeti ve fotoğraflar bu yıldan gelir."
          - label: "İletişim Bilgileri"
            name: iletisim
            widget: object
            fields:
              - { label: "E-posta Adresi", name: email, widget: string }
              - { label: "Telefon", name: telefon, widget: string, required: false, hint: "Boş bırakırsanız sitede telefon hiç görünmez. Örn. +90 555 123 45 67" }
          - label: "Sosyal Medya Hesapları"
            name: sosyal
            widget: list
            label_singular: "Hesap"
            summary: "{{fields.platform}} — {{fields.url}}"
            fields:
              - label: "Platform"
                name: platform
                widget: select
                options:
                  - { label: "Instagram", value: instagram }
                  - { label: "X (Twitter)", value: x }
                  - { label: "LinkedIn", value: linkedin }
                  - { label: "YouTube", value: youtube }
                  - { label: "Discord", value: discord }
                  - { label: "TikTok", value: tiktok }
              - { label: "Hesap Adresi", name: url, widget: string, hint: "Tam adres, örn. https://instagram.com/antconvention" }
          - { label: "X (Twitter) Kullanıcı Adı", name: xKullaniciAdi, widget: string, required: false, hint: "@ ile birlikte, örn. @antconvention" }
          - label: "Üst Menü"
            name: anaMenu
            widget: list
            label_singular: "Menü Öğesi"
            summary: "{{fields.ad}} → {{fields.href}}"
            hint: "Sürükleyerek sıralayabilirsiniz."
            fields: &menuAlanlari
              - { label: "Menüde Görünen Ad", name: ad, widget: string }
              - { label: "Bağlantı", name: href, widget: string, hint: "Site içi sayfa için /hakkinda gibi, dış site için https:// ile tam adres." }
          - label: "Alt Menü (sayfanın en altındaki Hızlı Linkler)"
            name: altMenu
            widget: list
            label_singular: "Menü Öğesi"
            summary: "{{fields.ad}} → {{fields.href}}"
            fields: *menuAlanlari
          - label: "Sayfa Altı (Footer) Metinleri"
            name: footer
            widget: object
            collapsed: true
            fields:
              - { label: "Tanıtım Cümlesi", name: tanitim, widget: text, hint: "Sloganın hemen arkasından gelir." }
              - { label: "'Katıl' Sütun Başlığı", name: katilBasligi, widget: string }
              - { label: "'Katıl' Sütun Metni", name: katilMetni, widget: text }
              - { label: "Sponsor Butonu", name: sponsorButonu, widget: string }
              - { label: "Konum Yazısı", name: konum, widget: string }
              - { label: "Telif Yazısı", name: telif, widget: string, hint: "Başına © ve yıl otomatik eklenir." }

  # ------------------------------------------------------------
  #  SAYFA METİNLERİ
  # ------------------------------------------------------------
  - name: sayfalar
    label: "📄 Sayfa Metinleri"
    label_singular: "Sayfa"
    description: "Her sayfadaki başlıklar, açıklamalar ve buton yazıları. İPUCU: Metinlerde {aktifYil}, {sonYil}, {tarih} veya {email} yazarsanız sitede güncel etkinlik yılı, geçen yıl, etkinlik tarihi ve e-posta adresi ile otomatik değiştirilir. **iki yıldız** arasına aldığınız kelimeler (izin verilen alanlarda) kalın görünür."
    editor: { preview: false }
    files:
      - name: anasayfa
        label: "Ana Sayfa"
        file: src/content/sayfalar/anasayfa.json
        fields:
          - { label: "Google Açıklaması", name: seoAciklama, widget: text, hint: "Google arama sonuçlarında görünen 1-2 cümle (150-160 karakter ideal)." }
          - label: "Üst Bölüm (Karşılama)"
            name: hero
            widget: object
            fields:
              - { label: "Üst Küçük Etiket", name: ustEtiket, widget: string }
              - { label: "Ana Sayfa Başlığı", name: baslik, widget: string }
              - { label: "Başlığın Turuncu Kısmı", name: baslikVurgu, widget: string, required: false, hint: "Başlığın devamında turuncu renkte görünür. Boş bırakılabilir." }
              - { label: "Karşılama Paragrafı", name: aciklama, widget: text, hint: "**iki yıldız** arasına aldığınız kısım kalın görünür." }
              - { label: "Durum Etiketi", name: durumEtiketi, widget: string, required: false, hint: "Tarih ve şehrin yanında görünen kısa durum, örn. 'Planlama aşamasında'. Boş bırakılırsa gizlenir." }
              - { label: "İkinci Buton", name: ikinciButon, widget: string, hint: "Geçen yılın arşiv sayfasına gider." }
              - { label: "Geri Sayım Başlığı", name: geriSayimBasligi, widget: string, hint: "Etkinlik tarihi girildiğinde görünür." }
              - { label: "Tarih Yokken: Başlık", name: tarihYokBasligi, widget: string }
              - { label: "Tarih Yokken: Metin", name: tarihYokMetni, widget: text }
              - { label: "Tarih Yokken: Buton", name: tarihYokButonu, widget: string }
          - label: "Geçen Yıl Özeti"
            name: gecenYil
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Detay Butonu", name: detayButonu, widget: string }
              - { label: "Fotoğraf Notu", name: fotoNotu, widget: string, hint: "Fotoğraf kaydırıcısının altında görünür." }
              - { label: "Galeri Butonu", name: galeriButonu, widget: string }
          - label: "AntCon Nedir? Bölümü"
            name: nedir
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: text }
              - { label: "Ek Paragraf", name: ekMetin, widget: text, required: false }
              - { label: "Buton", name: buton, widget: string }
              - label: "Kartlar"
                name: kartlar
                widget: list
                label_singular: "Kart"
                summary: "{{fields.baslik}}"
                fields: &kartAlanlari
                  - &ikonAlani
                    label: "İkon"
                    name: ikon
                    widget: select
                    options:
                      - { label: "📅 Takvim", value: takvim }
                      - { label: "🕒 Saat", value: saat }
                      - { label: "📍 Konum", value: konum }
                      - { label: "🎟️ Bilet", value: bilet }
                      - { label: "✉️ Zarf", value: posta }
                      - { label: "📞 Telefon", value: telefon }
                      - { label: "✔️ Onay", value: onay }
                      - { label: "⭐ Yıldız", value: yildiz }
                      - { label: "👥 Kişiler", value: kisiler }
                      - { label: "🎤 Mikrofon", value: mikrofon }
                      - { label: "✨ Kıvılcım", value: kivilcim }
                      - { label: "🎮 Oyun", value: oyun }
                      - { label: "🏆 Kupa", value: kupa }
                      - { label: "🛡️ Kalkan", value: kalkan }
                      - { label: "🌐 Dünya", value: kure }
                  - { label: "Başlık", name: baslik, widget: string }
                  - { label: "Metin", name: metin, widget: text }
          - label: "Hazırlık Durumu Bölümü"
            name: hazirlik
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: text }
              - label: "Maddeler"
                name: maddeler
                widget: list
                label_singular: "Madde"
                summary: "{{fields.baslik}} — {{fields.durum}}"
                fields:
                  - *ikonAlani
                  - { label: "Başlık", name: baslik, widget: string }
                  - { label: "Durum Rozeti", name: durum, widget: string, hint: "Örn. 'Hazırlanıyor', 'Başvurular açık'" }
                  - { label: "Metin", name: metin, widget: text }
                  - { label: "Tamamlandı mı? (rozet turuncu olur)", name: tamam, widget: boolean, required: false, default: false }
              - { label: "Birinci Buton", name: birinciButon, widget: string }
              - { label: "İkinci Buton", name: ikinciButon, widget: string }
          - label: "Destekçiler Bölümü"
            name: destekciler
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: text }
              - { label: "Buton", name: buton, widget: string }
          - label: "Sayfa Sonu Çağrısı"
            name: sonCta
            widget: object
            collapsed: true
            hint: "Bu bölümün paragrafı 'Bilet Satışı' ayarlarındaki bilgi metninden gelir."
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Birinci Buton", name: birinciButon, widget: string }
              - { label: "İkinci Buton", name: ikinciButon, widget: string }

      - name: hakkinda
        label: "Hakkında"
        file: src/content/sayfalar/hakkinda.md
        fields:
          - { label: "Google Açıklaması", name: seoAciklama, widget: text }
          - { label: "Üst Etiket", name: etiket, widget: string }
          - { label: "Sayfa Başlığı", name: baslik, widget: string }
          - { label: "Başlık Altı Açıklama", name: aciklama, widget: text }
          - label: "Hikâye Metni"
            name: body
            widget: markdown
            buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote]
            editor_components: []
            hint: "Sayfanın ana metni. Ara başlık eklemek için 'H2' butonunu kullanın."
          - label: "Sağdaki Durum Kutusu"
            name: durumKutusu
            widget: object
            collapsed: true
            hint: "Tarih, mekân ve bilet satırları otomatik doldurulur."
            fields:
              - { label: "Kutu Başlığı", name: baslik, widget: string }
              - { label: "Mekân Belli Değilken Yazan Not", name: mekanNotu, widget: string }
              - { label: "Geçen Yılın Etkinlik Notu", name: gecmisEtkinlikNotu, widget: string }
              - { label: "Arşiv Butonu", name: arsivButonu, widget: string }
          - label: "Değerlerimiz"
            name: degerler
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Maddeler", name: maddeler, widget: list, label_singular: "Değer", summary: "{{fields.baslik}}", fields: *kartAlanlari }
          - label: "Yolculuk (Zaman Çizelgesi)"
            name: yolculuk
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - label: "Adımlar"
                name: adimlar
                widget: list
                label_singular: "Adım"
                summary: "{{fields.tarih}} — {{fields.baslik}}"
                fields:
                  - { label: "Tarih", name: tarih, widget: string, hint: "Serbest metin: 'Ocak 2026', 'Şu an' gibi." }
                  - { label: "Başlık", name: baslik, widget: string }
                  - { label: "Metin", name: metin, widget: text }
                  - label: "Durum"
                    name: durum
                    widget: select
                    default: tamam
                    options:
                      - { label: "Tamamlandı", value: tamam }
                      - { label: "Şu an (vurgulu)", value: suan }
                      - { label: "Planlanan", value: planli }
          - label: "Fotoğraf Bölümü"
            name: galeri
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: string }

      - name: biletler
        label: "Biletler"
        file: src/content/sayfalar/biletler.json
        fields:
          - { label: "Google Açıklaması (satış açıkken)", name: seoAciklamaAcik, widget: text }
          - { label: "Google Açıklaması (satış kapalıyken)", name: seoAciklamaKapali, widget: text }
          - { label: "Üst Etiket", name: etiket, widget: string }
          - { label: "Sayfa Başlığı (satış açıkken)", name: acikBaslik, widget: string }
          - { label: "Başlık Altı Açıklama (satış açıkken)", name: acikAciklama, widget: text }
          - { label: "Sayfa Başlığı (satış kapalıyken)", name: kapaliBaslik, widget: string }
          - { label: "Başlık Altı Açıklama (satış kapalıyken)", name: kapaliAciklama, widget: text }
          - { label: "Geri Sayım Etiketi", name: geriSayimEtiketi, widget: string }
          - label: "Satış Kapalıyken Görünen Kutu"
            name: kapaliKutu
            widget: object
            collapsed: true
            hint: "Kutudaki paragraf 'Bilet Satışı' ayarlarından gelir."
            fields:
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Birinci Buton", name: birinciButon, widget: string }
              - { label: "İkinci Buton", name: ikinciButon, widget: string }
          - label: "Satış Açık Ama Bilet Tipi Eklenmemişken Görünen Kutu"
            name: acikKutu
            widget: object
            collapsed: true
            hint: "Biletleri dış bir sitede satıyor ve 'Bilet Tipleri' eklemiyorsanız bu kutu satış linkiyle birlikte görünür."
            fields:
              - { label: "Başlık", name: baslik, widget: string }
          - label: "Satış Süreci (satış kapalıyken görünür)"
            name: surec
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Açıklama", name: aciklama, widget: text }
              - { label: "Adımlar", name: adimlar, widget: list, label_singular: "Adım", summary: "{{fields.baslik}}", fields: *kartAlanlari }
          - label: "Bilete Dahil Olanlar"
            name: kapsam
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık (satış açıkken)", name: acikBaslik, widget: string }
              - { label: "Açıklama (satış açıkken)", name: acikAciklama, widget: text }
              - { label: "Başlık (satış kapalıyken)", name: kapaliBaslik, widget: string }
              - { label: "Açıklama (satış kapalıyken)", name: kapaliAciklama, widget: text }
              - { label: "Maddeler", name: maddeler, widget: list, label_singular: "Madde", field: { label: "Madde", name: madde, widget: string } }
          - label: "Bilet SSS Bölümü"
            name: sss
            widget: object
            collapsed: true
            hint: "Sorular 'Sıkça Sorulan Sorular' bölümünde kategorisi 'Bilet ve Kayıt' olanlardan gelir."
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Buton", name: buton, widget: string }

      - name: konusmacilar
        label: "Konuşmacılar"
        file: src/content/sayfalar/konusmacilar.json
        fields:
          - { label: "Google Açıklaması (kadro açıklandıysa)", name: seoAciklamaVar, widget: text }
          - { label: "Google Açıklaması (kadro yokken)", name: seoAciklamaYok, widget: text }
          - { label: "Üst Etiket", name: etiket, widget: string }
          - { label: "Sayfa Başlığı (kadro açıklandıysa)", name: varBaslik, widget: string }
          - { label: "Başlık Altı Açıklama (kadro açıklandıysa)", name: varAciklama, widget: text }
          - { label: "Sayfa Başlığı (kadro yokken)", name: yokBaslik, widget: string }
          - { label: "Başlık Altı Açıklama (kadro yokken)", name: yokAciklama, widget: text }
          - label: "Kadro Yokken Görünen Kutu"
            name: hazirlaniyor
            widget: object
            collapsed: true
            fields:
              - { label: "Başlık", name: baslik, widget: string }
              - { label: "Metin", name: metin, widget: text }
              - { label: "Birinci Buton", name: birinciButon, widget: string }
              - { label: "İkinci Buton", name: ikinciButon, widget: string }
          - label: "Geçen Yılın Kadrosu Başlığı"
            name: gecenYil
            widget: object
            collapsed: true
            fields:
              - { label: "Etiket", name: etiket, widget: string }
              - { label: "Başlık", name: baslik, widget: string }
