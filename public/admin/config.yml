  # ------------------------------------------------------------
  - name: program
    label: "🗓️ Program Akışı"
    label_singular: "Oturum"
    description: "Her oturum ayrı bir kayıttır. Sitede güne ve saate göre otomatik sıralanır."
    folder: src/content/program
    extension: md
    format: frontmatter
    create: true
    slug: "{{yil}}-{{slug}}"
    identifier_field: baslik
    summary: "{{yil}} · {{baslangic}} · {{baslik}}"
    sortable_fields: [yil, gun, baslangic]
    view_groups:
      - { label: "Yıl", field: yil }
    editor: { preview: false }
    fields:
      - { label: "Oturum Başlığı", name: baslik, widget: string }
      - { label: "Açıklama", name: aciklama, widget: text, required: false }
      - label: "Gün"
        name: gun
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
      - { label: "Gün Etiketi", name: gunEtiketi, widget: string, required: false, hint: "Boş bırakırsanız tarihten otomatik üretilir (örn. '28 Haziran 2026 Pazar')." }
      - { label: "Başlangıç Saati", name: baslangic, widget: string, pattern: ['^\d{2}:\d{2}$', 'Saati 10:00 biçiminde yazın'], hint: "Örn. 10:00" }
      - { label: "Bitiş Saati", name: bitis, widget: string, pattern: ['^\d{2}:\d{2}$', 'Saati 10:45 biçiminde yazın'], hint: "Örn. 10:45" }
      - { label: "Salon", name: salon, widget: string, default: "Ana Sahne" }
      - label: "Oturum Türü"
        name: tur
        widget: select
        default: konusma
        options:
          - { label: "Açılış", value: acilis }
          - { label: "Konuşma", value: konusma }
          - { label: "Panel", value: panel }
          - { label: "Atölye", value: atolye }
          - { label: "Gösteri", value: gosteri }
          - { label: "Turnuva", value: turnuva }
          - { label: "Mola", value: mola }
          - { label: "Kapanış", value: kapanis }
      - label: "Konuşmacılar"
        name: konusmacilar
        widget: relation
        collection: konusmacilar
        value_field: "{{slug}}"
        search_fields: [ad]
        display_fields: [ad, yil]
        multiple: true
