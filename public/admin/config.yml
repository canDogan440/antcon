  # ------------------------------------------------------------
  #  ETKİNLİK YILLARI
  # ------------------------------------------------------------
  - name: etkinlikler
    label: "📅 Etkinlik Yılları (tarih, mekân)"
    label_singular: "Etkinlik Yılı"
    description: "Her AntCon yılı için bir kayıt. 'Site Ayarları'nda seçili sıradaki yılın kaydı, ana sayfadaki tarihi, geri sayımı, mekânı ve haritayı belirler."
    folder: src/content/etkinlikler
    extension: md
    format: frontmatter
    create: true
    slug: "{{yil}}"
    identifier_field: baslik
    summary: "{{baslik}} — {{tarihMetni}}"
    sortable_fields: [yil]
    editor: { preview: false }
    fields:
      - { label: "Yıl", name: yil, widget: number, value_type: int, min: 2026, max: 2100 }
      - { label: "Başlık", name: baslik, widget: string, hint: "Örn. AntCon 2028" }
      - { label: "Slogan", name: slogan, widget: string, required: false }
      - label: "Durum"
        name: durum
        widget: select
        default: planlama
        options:
          - { label: "Planlama aşamasında (tarih belli değil)", value: planlama }
          - { label: "Yaklaşan (tarih açıklandı)", value: yaklasan }
          - { label: "Gerçekleşti (arşivde)", value: gecmis }
          - { label: "İptal edildi", value: iptal }
      - label: "Başlangıç Tarihi ve Saati"
        name: baslangic
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"
        hint: "Tarih kesinleşince doldurun: ana sayfada geri sayım otomatik başlar. Belli değilse boş bırakın."
      - label: "Bitiş Tarihi ve Saati"
        name: bitis
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"
      - { label: "Tarih Yazısı", name: tarihMetni, widget: string, hint: "Sitede yazı olarak görünen tarih, örn. '27 Haziran 2027' veya 'Tarih yakında açıklanacak'." }
      - { label: "Gün Yazısı", name: gunMetni, widget: string, required: false, hint: "Örn. Pazar" }
      - { label: "Saat Yazısı", name: saatMetni, widget: string, required: false, hint: "Örn. 10:00 - 20:00" }
      - label: "Mekân"
        name: mekan
        widget: object
        hint: "Mekân adını yazdığınızda iletişim sayfasında adres ve Google Haritalar otomatik görünür."
        fields:
          - { label: "Mekân Adı", name: ad, widget: string, required: false, hint: "Belli değilse boş bırakın." }
          - { label: "Adres", name: adres, widget: string, required: false }
          - { label: "İlçe", name: ilce, widget: string, required: false }
          - { label: "Posta Kodu", name: postaKodu, widget: string, required: false }
          - { label: "Şehir", name: sehir, widget: string, default: "Antalya" }
      - { label: "Kısa Özet", name: ozet, widget: text, hint: "Arşiv kartında ve Google'da görünür." }
      - { label: "Kapak Fotoğrafı", name: kapak, widget: image, required: false, choose_url: false, hint: "Boş bırakırsanız o yılın galerisindeki ilk fotoğraf kullanılır." }
      - { label: "Kapak Fotoğrafı Açıklaması", name: kapakAlt, widget: string, required: false, hint: "Görme engelli ziyaretçiler ve Google için fotoğrafta ne olduğunu anlatın." }
      - { label: "Bilet Linki (arşiv sayfası için)", name: biletUrl, widget: string, required: false }
      - label: "Rakamlar"
        name: istatistikler
        widget: list
        label_singular: "Rakam"
        summary: "{{fields.deger}} {{fields.etiket}}"
        hint: "Etkinlik sonrası: ziyaretçi sayısı, stant sayısı gibi. Ana sayfadaki geçen yıl özetinde de görünür."
        fields:
          - { label: "Değer", name: deger, widget: string, hint: "Örn. 2.400" }
          - { label: "Etiket", name: etiket, widget: string, hint: "Örn. Ziyaretçi" }
      - { label: "Öne Çıkanlar", name: oneCikanlar, widget: list, label_singular: "Madde", field: { label: "Madde", name: madde, widget: string } }
      - { label: "Taslak (sitede gizle)", name: taslak, widget: boolean, required: false, default: false }
      - label: "Detaylı Metin"
        name: body
        widget: markdown
        required: false
        buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list]
        editor_components: []
        hint: "Arşiv sayfasında özetin altında görünür."

  # ------------------------------------------------------------
  #  KONUŞMACILAR
  # ------------------------------------------------------------
  - name: konusmacilar
    label: "🎤 Konuşmacılar ve Jüri"
    label_singular: "Konuşmacı"
    folder: src/content/konusmacilar
    extension: md
    format: frontmatter
    create: true
    slug: "{{yil}}-{{slug}}"
    identifier_field: ad
    summary: "{{yil}} · {{ad}}"
    sortable_fields: [yil, sira, ad]
    view_groups:
      - { label: "Yıl", field: yil }
    editor: { preview: false }
    fields:
      - { label: "Ad Soyad", name: ad, widget: string }
      - { label: "Unvan / Meslek", name: unvan, widget: string, required: false, hint: "Bilinmiyorsa boş bırakın; kartta @kullanıcı adı görünür." }
      - { label: "Kurum", name: kurum, widget: string, required: false }
      - { label: "Sosyal Medya Kullanıcı Adı", name: kullaniciAdi, widget: string, required: false, hint: "@ işareti olmadan." }
      - label: "Rolü"
        name: rol
        widget: select
        default: konusmaci
        options:
          - { label: "Konuşmacı", value: konusmaci }
          - { label: "Cosplay Jürisi", value: juri }
      - { label: "Kısa Tanıtım", name: kisaBio, widget: text, required: false, hint: "1-2 cümle." }
      - label: "Fotoğraf"
        name: foto
        widget: image
        required: false
        choose_url: false
        media_folder: /src/assets/yuklemeler/konusmacilar
        public_folder: /src/assets/yuklemeler/konusmacilar
        hint: "Dikey (4:5) fotoğraf idealdir, örn. 1200x1500 piksel. Fotoğraf yoksa baş harfler gösterilir."
      - { label: "Fotoğraf Açıklaması", name: fotoAlt, widget: string, required: false, hint: "Boş bırakırsanız '<Ad> portre fotoğrafı' yazılır." }
      - label: "Sosyal Medya Adresleri"
        name: sosyal
        widget: object
        collapsed: true
        hint: "Tam adres yazın (https:// ile)."
        fields:
          - { label: "Instagram", name: instagram, widget: string, required: false }
          - { label: "X (Twitter)", name: x, widget: string, required: false }
          - { label: "LinkedIn", name: linkedin, widget: string, required: false }
          - { label: "YouTube", name: youtube, widget: string, required: false }
          - { label: "GitHub", name: github, widget: string, required: false }
          - { label: "Web Sitesi", name: web, widget: string, required: false }
      - { label: "Etiketler", name: etiketler, widget: list, required: false, hint: "Fotoğrafın üstünde görünür (ilk ikisi). Virgülle ayırın: Podcast, Cosplay" }
      - { label: "Öne Çıkan mı?", name: oneCikan, widget: boolean, required: false, default: false }
      - &yilAlani { label: "Etkinlik Yılı", name: yil, widget: number, value_type: int, min: 2026, max: 2100, hint: "Hangi yılın etkinliğine ait? Örn. 2027" }
      - &siraAlani { label: "Sıra", name: sira, widget: number, value_type: int, required: false, hint: "Küçük sayı önce görünür." }
      - &taslakAlani { label: "Taslak (sitede gizle)", name: taslak, widget: boolean, required: false, default: false }

